<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio 10</title>
    <style>
      .contorno {
        border: 1px solid black;
      }

      .centrar {
        text-align: center;
      }

      .image-fill {
        object-fit: cover;
      }
    </style>
    <script>
      let tid = -1
      let interval = 600
      let step = 50
      let started = false
      function roleFiguresForever() {
        tid = setInterval(roleFigures, interval);
        let button = document.getElementById("rollForever");
        button.outerHTML =
          '<button id="rollForever" type="button" style="margin-left: auto; margin-right: auto;" onclick="abortTimer()">Stop Rolling</button>';
      }
      function abortTimer() {
        clearInterval(tid);
        tid = -1;
        let button = document.getElementById("rollForever");
        button.outerHTML =
          '<button id="rollForever" type="button" style="margin-left: auto; margin-right: auto;" onclick="roleFiguresForever()">Roll Figures</button>';
      }
      function start() {
        tid = setInterval(roleFigures, interval);
        started = true
        buttonStatus();
      }
      function stop() {
        clearInterval(tid);
        tid = -1;
        started = false
        buttonStatus();
      }
      function buttonStatus() {
        let startbt = document.getElementById("start");
        let stopbt = document.getElementById("stop");
        if (tid > 0) {
          startbt.disabled = true;
          stopbt.disabled = false;
        } else {
          startbt.disabled = false;
          stopbt.disabled = true;
        }
      }

      function decelerate() {
        let intervalDisplay = document.getElementById("intervalDisplay");
        if (interval + step < 1000) {
          interval += step;
        } else {
          interval = 1000;
        }
        if (started){
          stop()
          start()
        }
        intervalDisplay.innerText = interval + " ms";
      }

      function accelerate() {
        let intervalDisplay = document.getElementById("intervalDisplay");
        if (interval - step > 100) {
          interval -= step;
        } else {
          interval = 100;
        }
        if (started){
          stop()
          start()
        }
        intervalDisplay.innerText = interval + " ms";
      }

      function roleFigures() {
        let fig1 = document.getElementById("fig1");
        let fig2 = document.getElementById("fig2");
        let fig3 = document.getElementById("fig3");
        let fig4 = document.getElementById("fig4");
        let fig5 = document.getElementById("fig5");
        let temp = fig5.innerHTML;
        fig5.innerHTML = fig4.innerHTML;
        fig4.innerHTML = fig3.innerHTML;
        fig3.innerHTML = fig2.innerHTML;
        fig2.innerHTML = fig1.innerHTML;
        fig1.innerHTML = temp;
      }
    </script>
  </head>

  <body>
    <p style="text-align: center">Smurfs</p>
    <div style="text-align: center; margin-bottom: 5px">
      <button id="start" type="button" onclick="start()">Start</button>
      <button id="stop" type="button" onclick="stop()">Stop</button>
    </div>
    <div
      style="
        text-align: center;
        width: 25%;
        margin-left: auto;
        margin-right: auto;
      "
    >
      <div style="display: flex; align-items: center">
        <button
          id="lowerInterval"
          type="button"
          style="margin-left: auto; margin-right: auto"
          onclick="
          accelerate()"
        >
          + Velocidade
        </button>
        <p id="intervalDisplay">600 ms</p>
        <button
          id="increaseInterval"
          type="button"
          style="margin-left: auto; margin-right: auto"
          onclick="decelerate()"
        >
          - Velocidade
        </button>
      </div>
    </div>
    <table
      class="contorno centrar"
      style="width: 100%; border-spacing: 0px; border-collapse: collapse"
    >
      <tr>
        <td id="fig1" class="contorno centrar">
          <img class="image-fill" src="images/cat1.jfif" alt="" />
        </td>
        <td class="contorno centrar"></td>
        <td id="fig2" class="contorno centrar">
          <img class="image-fill" src="images/cat2.jfif" alt="" />
        </td>
      </tr>
      <tr>
        <td class="contorno centrar"></td>
        <td id="fig3" class="contorno centrar">
          <img class="image-fill" src="images/cat3.jfif" alt="" />
        </td>
        <td class="contorno centrar"></td>
      </tr>
      <tr>
        <td id="fig4" class="contorno centrar">
          <img class="image-fill" src="images/cat4.jfif" alt="" />
        </td>
        <td class="contorno centrar"></td>
        <td id="fig5" class="contorno centrar">
          <img class="image-fill" src="images/cat5.jfif" alt="" />
        </td>
      </tr>
    </table>
  </body>
</html>
