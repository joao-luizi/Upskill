<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            width: 50px;
            height: 30px;
        }
        td {
            padding: 5px 15px 0px 15px;
        }
    </style>
    <script>
        var clear = true;
        function addDisplay(x){
            
            let display = document.getElementById("display");
            if (clear)
                display.innerHTML = "";
            display.innerHTML += x
            clear = false;
        }
        function clearDisplay(){
            let display = document.getElementById("display");
            display.innerHTML = "";
            clear = false;
        }
        function remDisplay(){
            let display = document.getElementById("display");
            display.innerHTML = display.innerHTML.slice(0, -1);
            clear = false;
        }
        function evalDisplay(){
            let display = document.getElementById("display");
            let normalDisplay = display.innerHTML.replace("÷", "/").replace("x", "*")
            let result = eval(normalDisplay);
            display.innerHTML = result;
            clear = true;
        }
    </script>
</head>

<body style="width: 100%; display:flex; flex-direction: column; align-items: center;">
    <div id="display" style="border: 1px solid black; width: 25%; height: 30px; margin-bottom: 5px; text-align: right;"></div>
    <table style="border: 1px solid black; width:25%;">
        <tr>
            <td></td>
        </tr>
        <tr>
            <td><button type="button" onclick="clearDisplay()">CE</button></td>
            <td><button type="button" onclick="clearDisplay()">C</button></td>
            <td><button type="button" onclick="remDisplay()">DEL</button></td>
            <td><button type="button" style="background-color: blue; color: white;" onclick="evalDisplay()">=</button></td>
        </tr>
        <tr>
            <td><button type="button" onclick="addDisplay('÷')">÷</button></td>
            <td><button type="button" onclick="addDisplay('x')">x</button></td>
            <td><button type="button" onclick="addDisplay('+')" >+</button></td>
            <td><button type="button" onclick="addDisplay('-')">-</button></td>
        </tr>
        <tr>
            <td><button type="button" onclick="addDisplay('7')">7</button></td>
            <td><button type="button" onclick="addDisplay('8')">8</button></td>
            <td><button type="button" onclick="addDisplay('9')">9</button></td>
            <td></td>
        </tr>
        <tr>
            <td><button type="button" onclick="addDisplay('4')">4</button></td>
            <td><button type="button" onclick="addDisplay('5')">5</button></td>
            <td><button type="button" onclick="addDisplay('6')">6</button></td>
            <td></td>
        </tr>
        <tr>
            <td><button type="button" onclick="addDisplay('1')">1</button></td>
            <td><button type="button" onclick="addDisplay('2')">2</button></td>
            <td><button type="button" onclick="addDisplay('3')">3</button></td>
            <td></td>
        </tr>
        
    </table>
</body>

</html>
